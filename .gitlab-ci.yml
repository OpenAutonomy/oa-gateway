# Basic build/test gate. No image publish, no release.
# rust-toolchain.toml pins 1.85.0; the image matches that channel.

stages:
  - check
  - test
  - deploy

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

default:
  image: rust:1.85.0-bookworm
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .cargo/
      - target/

fmt:
  stage: check
  script:
    - rustup component add rustfmt
    - cargo fmt --all --check

clippy:
  stage: check
  script:
    - rustup component add clippy
    - cargo clippy --workspace --all-targets --locked -- -D warnings

test:
  stage: test
  script:
    - cargo test --workspace --locked

# Keeps intra-doc links and the runnable adapter example in oa-gateway-adapter honest.
# Private items are included so the host binary's modules appear in the HTML.
docs:
  stage: check
  variables:
    RUSTDOCFLAGS: "-D warnings"
  script:
    - cargo doc --workspace --no-deps --locked --document-private-items
    - ./scripts/write-rustdoc-index.sh target/doc
  artifacts:
    name: rustdoc
    paths:
      - target/doc
    expire_in: 1 week

# GitLab Pages serves the `public/` artifact of a job named `pages`.
pages:
  stage: deploy
  needs: [docs]
  script:
    - mv target/doc public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

bench:
  stage: test
  needs: [test]
  script:
    - ./scripts/ci-bench.sh
  artifacts:
    name: bench
    paths:
      - bench/
    expire_in: 1 week

live-activemq:
  stage: test
  needs: [test]
  services:
    - name: apache/activemq-classic:5.18.7
      alias: activemq
  variables:
    OAG_ACTIVEMQ_STOMP: activemq:61613
  script:
    - |
      echo "waiting for STOMP activemq:61613 …"
      for _ in $(seq 1 40); do
        if (echo >/dev/tcp/activemq/61613) >/dev/null 2>&1; then
          break
        fi
        sleep 0.5
      done
      if ! (echo >/dev/tcp/activemq/61613) >/dev/null 2>&1; then
        echo "ActiveMQ STOMP port never opened" >&2
        exit 1
      fi
      sleep 1
    - cargo test -p oa-gateway-testing --test live_activemq --locked -- --ignored --nocapture --test-threads=1
