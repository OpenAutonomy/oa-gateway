[package]
name = "oa-gateway-testing"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Shared fixtures and test harness for oa-gateway (not a runtime crate)"

[features]
default = ["harness"]
harness = [
    "dep:bytes",
    "dep:futures-util",
    "dep:oa-gateway-agra",
    "dep:oa-gateway-core",
    "dep:oa-gateway-loopback",
    "dep:oa-gateway-owp",
    "dep:oa-gateway-stomp",
    "dep:oa-gateway-uci",
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:tokio-util",
]

[dependencies]
bytes = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
oa-gateway-agra = { workspace = true, optional = true }
oa-gateway-core = { workspace = true, optional = true }
oa-gateway-loopback = { workspace = true, optional = true }
oa-gateway-owp = { workspace = true, optional = true }
oa-gateway-stomp = { workspace = true, optional = true }
oa-gateway-uci = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }

[dev-dependencies]
bytes.workspace = true
oa-gateway-agra.workspace = true
oa-gateway-core.workspace = true
oa-gateway-loopback.workspace = true
oa-gateway-owp.workspace = true
oa-gateway-stomp.workspace = true
oa-gateway-uci.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
