[package]
name = "oa-gateway-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Latency and throughput utility for oa-gateway (not a runtime crate)"

[[bin]]
name = "oa-gateway-bench"
path = "src/main.rs"

[dependencies]
bytes.workspace = true
futures-util.workspace = true
oa-gateway-core.workspace = true
oa-gateway-loopback.workspace = true
oa-gateway-owp.workspace = true
oa-gateway-testing = { workspace = true, features = ["harness"] }
oa-gateway-uci.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
