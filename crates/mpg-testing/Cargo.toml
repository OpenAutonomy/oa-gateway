[package]
name = "mpg-testing"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Shared fixtures and test harness for mpg (not a runtime crate)"

[features]
default = ["harness"]
harness = [
    "dep:bytes",
    "dep:futures-util",
    "dep:mpg-agra",
    "dep:mpg-core",
    "dep:mpg-loopback",
    "dep:mpg-owp",
    "dep:mpg-stomp",
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:tokio-util",
]

[dependencies]
bytes = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
mpg-agra = { workspace = true, optional = true }
mpg-core = { workspace = true, optional = true }
mpg-loopback = { workspace = true, optional = true }
mpg-owp = { workspace = true, optional = true }
mpg-stomp = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }

[dev-dependencies]
bytes.workspace = true
mpg-agra.workspace = true
mpg-core.workspace = true
mpg-loopback.workspace = true
mpg-owp.workspace = true
mpg-stomp.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
