name: release

# Push a `vX.Y.Z` tag and this builds the release: a Linux binary with
# checksums, a CycloneDX SBOM, a GitHub Release whose body is the matching
# CHANGELOG section, and a `ghcr.io` image. `workflow_dispatch` runs the same
# build without publishing, for a dry run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@v2

      - name: version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: build
        run: cargo build --release -p oa-gateway --locked

      - name: package binary and checksums
        run: |
          mkdir dist
          bin="oa-gateway-${{ steps.v.outputs.version }}-x86_64-unknown-linux-gnu"
          cp target/release/oa-gateway "dist/$bin"
          ( cd dist && sha256sum "$bin" > sha256sums.txt )

      - name: sbom
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/oa-gateway-${{ steps.v.outputs.version }}.cdx.json

      - name: release notes from CHANGELOG
        run: |
          awk -v ver="${{ steps.v.outputs.version }}" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > dist/notes.md
          if [ ! -s dist/notes.md ]; then
            echo "No CHANGELOG.md section for ${{ steps.v.outputs.version }}." > dist/notes.md
          fi

      - name: create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/notes.md
          files: |
            dist/oa-gateway-*-x86_64-unknown-linux-gnu
            dist/sha256sums.txt
            dist/oa-gateway-*.cdx.json

      - name: upload dry-run artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: dist/
          retention-days: 14

  image:
    # Separate from `release` and with no `needs`: a schema-fetch hiccup during
    # the image build must not hold up the GitHub Release.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: |
            ghcr.io/openautonomy/oa-gateway:${{ steps.v.outputs.version }}
            ghcr.io/openautonomy/oa-gateway:latest
