name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      - name: docs
        run: cargo doc --workspace --no-deps --locked --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: rustdoc landing page
        run: ./scripts/write-rustdoc-index.sh target/doc
      - name: install mdbook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin
          curl -sSL https://github.com/badboy/mdbook-mermaid/releases/download/v0.17.1/mdbook-mermaid-v0.17.1-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin
      - name: build guide
        run: |
          mdbook-mermaid install .
          mdbook build
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: target/doc
          retention-days: 14

  msrv:
    # Builds the workspace on exactly the toolchain named by `rust-version`
    # in Cargo.toml. The other jobs pin 1.85.0 by hand, so today the floor is
    # only exercised as a side effect; this asserts it, and reads the version
    # from Cargo.toml so the two cannot drift.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: read MSRV from Cargo.toml
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MSRV is $version"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: check
        run: cargo check --workspace --all-targets --locked

  pages:
    # HTML is already built in `test`: rustdoc at the root, the docs/*.md
    # guide under guide/. This job only publishes it. Private repos, fork
    # PRs, and feature branches keep the site artifact; they do not write
    # the site. A free personal plan cannot host Pages on a private
    # repository.
    if: >-
      github.event_name == 'push'
      && !github.event.repository.private
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: doc
      # Artifacts belong to the workflow run, not the attempt.
      # Re-running this job would otherwise upload a second
      # `github-pages` next to the first, and deploy-pages@v5
      # refuses to choose.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: doc
          name: github-pages-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  bench:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: latency and throughput suite
        run: ./scripts/ci-bench.sh
      - uses: actions/upload-artifact@v7
        with:
          name: bench
          path: bench/
          retention-days: 14

  live-activemq:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: start ActiveMQ Classic
        run: docker compose -f compose/activemq.yml up -d --wait
      - name: XML PositionReport round-trip
        run: cargo test -p oa-gateway-testing --test live_activemq --locked -- --ignored --nocapture --test-threads=1
        env:
          OAG_ACTIVEMQ_STOMP: 127.0.0.1:61613

  coverage:
    # Visibility only: uploads an lcov + HTML report as a build artifact.
    # No threshold and no gate on the other jobs; a `--fail-under` can be
    # added once a baseline is known.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: coverage
        run: |
          cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
          cargo llvm-cov report --html
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            lcov.info
            target/llvm-cov/html
          retention-days: 14
