name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      - name: docs
        run: cargo doc --workspace --no-deps --locked --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: rustdoc landing page
        run: ./scripts/write-rustdoc-index.sh target/doc
      - uses: actions/upload-artifact@v4
        with:
          name: rustdoc
          path: target/doc
          retention-days: 14

  pages:
    # HTML is already built in `test`. This job only publishes it. Fork PRs
    # and feature branches keep the artifact; they do not write the site.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rustdoc
          path: doc
      - uses: actions/upload-pages-artifact@v3
        with:
          path: doc
      - id: deployment
        uses: actions/deploy-pages@v4

  live-activemq:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: start ActiveMQ Classic
        run: docker compose -f compose/activemq.yml up -d --wait
      - name: XML PositionReport round-trip
        run: cargo test -p oa-gateway-testing --test live_activemq --locked -- --ignored --nocapture --test-threads=1
        env:
          OAG_ACTIVEMQ_STOMP: 127.0.0.1:61613
