# OA-Gateway only. Config path is required — there is no default.
#
#   OAG_CONFIG=$PWD/config/compose.toml docker compose -f compose/gateway.yml up --build
#
# OWP WebSocket on the host: ws://127.0.0.1:9000/  (Sec-WebSocket-Protocol: owp)
#
# For a local ActiveMQ Classic without the gateway, see compose/activemq.yml.

services:
  oa-gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    image: oa-gateway:local
    container_name: oa-gateway
    ports:
      # Publish on loopback only; the process listens on 0.0.0.0 inside the
      # container so Docker can forward this mapping (see the mounted config).
      - "127.0.0.1:9000:9000"
    volumes:
      - ${OAG_CONFIG:?set OAG_CONFIG to a TOML config path}:/config/gateway.toml:ro
    command: ["/config/gateway.toml"]
    environment:
      RUST_LOG: info
    restart: unless-stopped
