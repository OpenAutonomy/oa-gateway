# Prototype host config. No TLS and no authentication — bind loopback only.

# How often the host logs engine published/delivered/dropped. 0 disables.
# [engine]
# stats_interval_secs = 30

# No UCI schema is needed here, because xml_baseline is off and payloads cross
# the engine untouched. To convert, or to have payloads checked against the
# standard, run scripts/fetch-uci-schema.sh and uncomment the block below; see
# config/asb.toml for the XML-toward-ActiveMQ setup.
#
# validate decides what happens to a payload the schema does not permit: "warn"
# reports it and carries it anyway, "reject" refuses it and tells the peer, "off"
# skips the check. It does nothing without a schema, since there is nothing to
# check against.
# [uci]
# schema = ["schema/uci/UCI_MessageDefinitions_v2_5_0.xsd",
#           "schema/uci/UCI_SecurityMarkings_v2_5_0.xsd"]
# validate = "warn"

[loopback]
id = "loopback"

[owp]
id = "owp"
bind = "127.0.0.1:9000"
server_id = "oa-gateway-0"
system_label = "OA-Gateway Prototype"
schema = "002.5.0"
# Peel A-GRA MA_RxDataPayload / MA_TxDataPayloadCommand hex wrappers on PUB.
# Engine sees both the wrapper MT and the inner UCI message.
unwrap_ma_payloads = true
# Local toy: leave JSON on the engine. Use config/asb.toml for XML toward ActiveMQ.
xml_baseline = false
# Resource limits, shown at their defaults. A client is not authenticated, so
# these are what stands between one peer and the memory of every other.
# A frame above max_frame_size ends that session; a connection over the limit is
# closed on accept; a SUB past the limit is answered with Illegal-State and the
# session continues. The subscription default sits above the size of the UCI
# catalog, so subscribing to every message type in the standard still fits.
max_frame_size = 16777216
max_connections = 256
max_subscriptions = 1024

# DDS is omitted here. See config/dds.toml and config/dds-qos.xml.
#
# Client to an ActiveMQ (or other) STOMP broker. Naming the table turns
# it on; enabled = false keeps these keys without connecting. Java
# CAL/OpenWire peers share these destinations.
[stomp]
enabled = false
id = "stomp"
broker = "127.0.0.1:61613"
host = "/"
login = ""
passcode = ""
destination_prefix = "/topic/"
# Engine topic names == STOMP dest suffixes. List UCI message type names
# (PositionReport, SubsystemStatus, …).
topics = ["demo"]
unwrap_ma_payloads = true
reconnect = true
# reconnect_delay_secs = 1
# connect_timeout_secs = 5
# suppress_echo = true
# on_panic = "abort"   # or "reconnect"
