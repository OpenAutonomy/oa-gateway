# OA-Gateway on a local ActiveMQ Classic ASB. Requires:
#   ./scripts/fetch-uci-schema.sh
#   docker compose -f compose/activemq.yml up -d
#
# Engine topic == JMS / STOMP dest suffix (UCI message type name).

# The UCI schema that drives JSON ↔ XML conversion. The standard is not
# redistributed with this repository, so run scripts/fetch-uci-schema.sh to
# populate these paths, or point them at your own copy. Both documents are
# needed: the message definitions include the security markings, and leaving
# them out is reported as unresolved types. xml_baseline below cannot work
# without a schema, and startup says so rather than failing per message.
# Paths are relative to where you run oa-gateway, normally the repo root.
[uci]
schema = [
  "schema/uci/UCI_MessageDefinitions_v2_5_0.xsd",
  "schema/uci/UCI_SecurityMarkings_v2_5_0.xsd",
]
# What to do about a payload the schema does not permit — an element no type
# declares, a required one absent, an occurrence range or an alternation broken.
# "warn" reports it and carries the message anyway, which is what you want while
# bringing a producer up. "reject" refuses it and tells the peer what was wrong.
# "off" skips the check, and the parse it costs. Conversion succeeding says
# nothing about this: a message can convert cleanly and still not be a valid
# instance of the standard.
validate = "warn"

[loopback]
enabled = true
id = "loopback"

[owp]
enabled = true
id = "owp"
bind = "127.0.0.1:9000"
server_id = "oa-gateway-0"
system_label = "OA-Gateway ASB"
schema = "002.5.0"
unwrap_ma_payloads = true
# OMS JSON at the WebSocket; UCI XML toward ActiveMQ.
xml_baseline = true

[stomp]
enabled = true
id = "stomp"
broker = "127.0.0.1:61613"
host = "/"
login = ""
passcode = ""
destination_prefix = "/topic/"
topics = ["PositionReport"]
unwrap_ma_payloads = true
reconnect = true
