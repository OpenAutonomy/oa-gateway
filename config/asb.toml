# OA-Gateway on a local ActiveMQ Classic ASB. Requires:
#   docker compose -f compose/activemq.yml up -d
#   a local copy of the UCI schema, named under [uci] below
#
# Engine topic == JMS / STOMP dest suffix (UCI message type name).

# The UCI schema that drives JSON ↔ XML conversion. The standard is not
# redistributed with this repository, so point these at your own copy and list
# every document the schema spans — naming UCI_MessageDefinitions alone leaves
# the security-marking types unresolved, which is reported as an error.
# xml_baseline below cannot work without this, and startup will say so.
[uci]
schema = [
  # "/path/to/UCI_MessageDefinitions_v2_5_0.xsd",
  # "/path/to/UCI_SecurityMarkings_v2_5_0.xsd",
]

[loopback]
enabled = true
id = "loopback"

[owp]
enabled = true
id = "owp"
bind = "127.0.0.1:9000"
server_id = "oa-gateway-0"
system_label = "OA-Gateway ASB"
schema = "002.5.0"
unwrap_ma_payloads = true
# OMS JSON at the WebSocket; UCI XML toward ActiveMQ.
xml_baseline = true

[stomp]
enabled = true
id = "stomp"
broker = "127.0.0.1:61613"
host = "/"
login = ""
passcode = ""
destination_prefix = "/topic/"
topics = ["PositionReport"]
unwrap_ma_payloads = true
reconnect = true
