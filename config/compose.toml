# Worked example for compose/gateway.yml. Same shape as default.toml, but OWP
# listens on all interfaces so the published host port can reach it. Host-side
# publishing is still pinned to 127.0.0.1 in the compose file — see SECURITY.md.
#
#   OAG_CONFIG=$PWD/config/compose.toml docker compose -f compose/gateway.yml up --build
#
# STOMP is off here. Point stomp.broker at a host the container can reach (for
# example host.docker.internal:61613 on Docker Desktop) and enable the section
# when bridging a broker you run separately.

[loopback]
id = "loopback"

[owp]
id = "owp"
bind = "0.0.0.0:9000"
server_id = "oa-gateway-0"
system_label = "OA-Gateway Prototype"
schema = "002.5.0"
unwrap_ma_payloads = true
xml_baseline = false

[stomp]
enabled = false
id = "stomp"
broker = "127.0.0.1:61613"
host = "/"
login = ""
passcode = ""
destination_prefix = "/topic/"
topics = ["demo"]
unwrap_ma_payloads = true
reconnect = true
