[workspace]
members = [
    "crates/oa-gateway-core",
    "crates/oa-gateway-adapter",
    "crates/oa-gateway-agra",
    "crates/oa-gateway-loopback",
    "crates/oa-gateway-owp",
    "crates/oa-gateway-stomp",
    "crates/oa-gateway-dds",
    "crates/oa-gateway-uci",
    "crates/oa-gateway-testing",
    "crates/oa-gateway-bench",
    "crates/oa-gateway",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.3.0"
rust-version = "1.85"
# Nothing here is on crates.io. Saying so keeps the wildcard check in deny.toml
# meaningful: the crates in this workspace refer to each other by path, which is
# only a defensible `*` requirement while they are unpublished.
publish = false

# Inherited by every member crate via `[lints] workspace = true`. CI already
# runs `cargo clippy -- -D warnings`, so a `warn` here is a hard gate there.
[workspace.lints.rust]
# SECURITY.md states there is no `unsafe` in the workspace. `forbid` (not
# `deny`) makes that enforceable: it cannot be re-enabled with a local
# `#[allow(unsafe_code)]`. Introducing `unsafe` becomes a deliberate change
# to this line.
unsafe_code = "forbid"

[workspace.lints.clippy]
# `pedantic` as the baseline standard. The entries below opt back out of the
# lints that are high-noise and low-value for this codebase specifically:
# heavy doc prose, deliberate numeric casts in the engine, and stylistic
# naming choices. Anything not listed here is expected to be fixed, not
# silenced.
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# The parsers and QoS/JSON dispatch tables spell out every match arm on
# purpose, even where two share a body; merging them for the linter would
# cost more in readability than it saves.
match_same_arms = "allow"
# Several codec and adapter entry points take owned arguments deliberately
# (ownership handed on, or a signature kept uniform across an interface).
needless_pass_by_value = "allow"
# The adapter config structs are flat bags of independent on/off switches.
struct_excessive_bools = "allow"

[workspace.dependencies]
async-trait = "0.1"
bytes = "1"
hex = "0.4"
futures-util = "0.3"
regex = { version = "1", default-features = false, features = ["std", "unicode"] }
roxmltree = "0.21"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
rustdds = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = "0.30"
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }

oa-gateway-core = { path = "crates/oa-gateway-core" }
oa-gateway-adapter = { path = "crates/oa-gateway-adapter" }
oa-gateway-agra = { path = "crates/oa-gateway-agra" }
oa-gateway-uci = { path = "crates/oa-gateway-uci" }
oa-gateway-loopback = { path = "crates/oa-gateway-loopback" }
oa-gateway-owp = { path = "crates/oa-gateway-owp" }
oa-gateway-stomp = { path = "crates/oa-gateway-stomp" }
oa-gateway-dds = { path = "crates/oa-gateway-dds" }
oa-gateway-testing = { path = "crates/oa-gateway-testing", default-features = false }
