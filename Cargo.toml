[workspace]
members = [
    "crates/mpg-core",
    "crates/mpg-adapter",
    "crates/mpg-agra",
    "crates/mpg-loopback",
    "crates/mpg-owp",
    "crates/mpg-stomp",
    "crates/mpg-uci",
    "crates/mpg-testing",
    "crates/mpg",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
async-trait = "0.1"
bytes = "1"
hex = "0.4"
futures-util = "0.3"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }

mpg-core = { path = "crates/mpg-core" }
mpg-adapter = { path = "crates/mpg-adapter" }
mpg-agra = { path = "crates/mpg-agra" }
mpg-uci = { path = "crates/mpg-uci" }
mpg-loopback = { path = "crates/mpg-loopback" }
mpg-owp = { path = "crates/mpg-owp" }
mpg-stomp = { path = "crates/mpg-stomp" }
mpg-testing = { path = "crates/mpg-testing", default-features = false }
