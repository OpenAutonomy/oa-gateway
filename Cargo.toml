[workspace]
members = [
    "crates/oa-gateway-core",
    "crates/oa-gateway-adapter",
    "crates/oa-gateway-agra",
    "crates/oa-gateway-loopback",
    "crates/oa-gateway-owp",
    "crates/oa-gateway-stomp",
    "crates/oa-gateway-uci",
    "crates/oa-gateway-testing",
    "crates/oa-gateway",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
# Nothing here is on crates.io. Saying so keeps the wildcard check in deny.toml
# meaningful: the crates in this workspace refer to each other by path, which is
# only a defensible `*` requirement while they are unpublished.
publish = false

[workspace.dependencies]
async-trait = "0.1"
bytes = "1"
hex = "0.4"
futures-util = "0.3"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }

oa-gateway-core = { path = "crates/oa-gateway-core" }
oa-gateway-adapter = { path = "crates/oa-gateway-adapter" }
oa-gateway-agra = { path = "crates/oa-gateway-agra" }
oa-gateway-uci = { path = "crates/oa-gateway-uci" }
oa-gateway-loopback = { path = "crates/oa-gateway-loopback" }
oa-gateway-owp = { path = "crates/oa-gateway-owp" }
oa-gateway-stomp = { path = "crates/oa-gateway-stomp" }
oa-gateway-testing = { path = "crates/oa-gateway-testing", default-features = false }
